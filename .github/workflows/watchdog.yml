# External watchdog: a dead server can't announce its own death, so GitHub
# (separate hardware) pings the site every ~5 min and sends a Telegram alert
# when it stops responding. The ping also wakes a sleeping Render free
# instance, whose autostart then revives the monitor -> downtime self-heals.
# Secrets (Settings -> Secrets -> Actions): ASP_URL, TG_TOKEN, TG_CHAT.
name: watchdog

on:
  schedule:
    - cron: "2-59/5 * * * *"   # every 5 min, offset to dodge GitHub's busy :00 slots
  workflow_dispatch:
    inputs:
      test:
        description: "Also send a Telegram test message"
        type: boolean
        default: false

permissions:
  actions: read     # read previous run's conclusion (one alert per outage)
  contents: write   # keepalive commit (GitHub disables idle crons after 60 days)

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check site, alert on Telegram if down
        env:
          URL: ${{ secrets.ASP_URL }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GH_TOKEN: ${{ github.token }}
          TEST: ${{ inputs.test }}
        run: |
          send() {
            curl -s -o /dev/null "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" -d parse_mode=HTML --data-urlencode "text=$1"
          }
          if [ "$TEST" = "true" ]; then
            send "🧪 <b>Watchdog</b>: test - alerta Telegram functioneaza (verificare la 5 min)."
          fi

          code=000; ok=""
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "$URL/api/status" || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 50   # a sleeping Render instance wakes ~1 min after the first request
          done

          # dedup: if the previous run already failed, the alert was already sent
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow watchdog.yml \
                   --status completed --limit 1 --json conclusion \
                   --jq '.[0].conclusion' 2>/dev/null || echo "")

          if [ -n "$ok" ]; then
            if [ "$prev" = "failure" ]; then
              send "✅ <b>ASP Monitor</b>: site-ul raspunde din nou. Verifica mesajul 🔄 de repornire - daca lipseste, porneste monitorul din site."
            fi
            echo "Site OK."
          else
            if [ "$prev" = "failure" ]; then
              echo "Still down - alert already sent by a previous run."
            else
              send "🚨 <b>ASP Monitor pare MORT</b>: site-ul nu a raspuns la 3 incercari (ultimul raspuns: HTTP $code). Nicio verificare de locuri nu ruleaza acum - vezi dashboard.render.com."
            fi
            exit 1
          fi

      - name: Checkout (for keepalive)
        if: always()
        uses: actions/checkout@v4

      - name: Keepalive commit if last commit older than 50 days
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 50 ]; then
            git config user.name "watchdog"
            git config user.email "watchdog@users.noreply.github.com"
            git commit --allow-empty -m "keepalive (GitHub disables idle scheduled workflows)"
            git push
          else
            echo "Repo recent enough - no keepalive needed."
          fi
